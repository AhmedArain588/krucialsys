<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>IoT & Smart Systems — Krucial Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../shared/icons.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}body{overflow-x:hidden;}@media(max-width:900px){.nav-links{display:none!important}.hamburger{display:flex!important;flex-direction:column}.hero-split{grid-template-columns:1fr!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr 1fr!important}.grid-4{grid-template-columns:1fr 1fr!important}.footer-grid{grid-template-columns:1fr 1fr!important}}@media(max-width:600px){.grid-3,.grid-4,.footer-grid{grid-template-columns:1fr!important}}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#05060F}::-webkit-scrollbar-thumb{background:#0A84FF55;border-radius:3px}</style>
</head><body><div id="root"></div>
<script src="../shared/themes.js"></script>
<script type="text/babel" src="../shared/layout.jsx"></script>
<script type="text/babel">

const { useState, useEffect } = React;

function SmartBuildingVisual({ theme: t }) {
  const [tick, setTick] = useState(0);
  useEffect(() => { const id = setInterval(() => setTick(x => x + 1), 1200); return () => clearInterval(id); }, []);

  const sensors = [
    { x:20, y:25, label:'Temp', value:'23.4°C', icon:'Zap', status:'ok' },
    { x:55, y:18, label:'Occupancy', value:'34 ppl', icon:'Users', status:'ok' },
    { x:78, y:35, label:'Energy', value:'42 kWh', icon:'Activity', status:'warn' },
    { x:15, y:60, label:'Air Quality', value:'Good', icon:'Globe', status:'ok' },
    { x:50, y:65, label:'HVAC', value:'AUTO', icon:'RefreshCw', status:'ok' },
    { x:80, y:68, label:'Security', value:'Armed', icon:'Shield', status:'ok' },
  ];

  return (
    <div style={{ background:t.bgAlt, border:`1px solid ${t.accent}33`, borderRadius:16, padding:24 }}>
      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
        <span style={{ color:t.text, fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:14 }}>Smart Building Dashboard</span>
        <span style={{ color:'#00C896', fontSize:11, background:'#00C89622', borderRadius:100, padding:'3px 10px', fontWeight:700 }}>● 6 Devices Online</span>
      </div>
      {/* Building SVG with sensor nodes */}
      <div style={{ position:'relative', background:t.bg, border:`1px solid ${t.accent}18`, borderRadius:10, height:160, marginBottom:12, overflow:'hidden' }}>
        <svg viewBox="0 0 100 80" style={{ width:'100%', height:'100%' }} preserveAspectRatio="xMidYMid meet">
          {/* Building outline */}
          <rect x="15" y="15" width="70" height="55" rx="2" fill="none" stroke={`${t.accent}33`} strokeWidth="0.8"/>
          <rect x="15" y="45" width="70" height="25" rx="0" fill={`${t.accent}06`} stroke="none"/>
          <line x1="15" y1="45" x2="85" y2="45" stroke={`${t.accent}22`} strokeWidth="0.5" strokeDasharray="2,2"/>
          <line x1="15" y1="30" x2="85" y2="30" stroke={`${t.accent}22`} strokeWidth="0.5" strokeDasharray="2,2"/>
          {/* Windows */}
          {[[22,18],[35,18],[48,18],[61,18],[74,18],[22,33],[35,33],[48,33],[61,33],[74,33]].map(([x,y],i) => (
            <rect key={i} x={x} y={y} width="8" height="6" rx="1" fill={`${t.accent}${tick%10===i?'44':'18'}`} stroke={`${t.accent}33`} strokeWidth="0.3"/>
          ))}
          {/* Connection lines between sensors */}
          {sensors.map((s,i) => sensors.slice(i+1).map((s2,j) => {
            const dist = Math.sqrt((s.x-s2.x)**2+(s.y-s2.y)**2);
            if (dist < 40) return <line key={j} x1={s.x} y1={s.y} x2={s2.x} y2={s2.y} stroke={`${t.accent}20`} strokeWidth="0.4"/>;
            return null;
          }))}
          {/* Sensor nodes */}
          {sensors.map((s,i) => (
            <g key={i}>
              <circle cx={s.x} cy={s.y} r="3.5" fill={s.status==='warn'?'#E8A02044':(`${t.accent}33`)} stroke={s.status==='warn'?'#E8A020':t.accent} strokeWidth="0.8"/>
              <circle cx={s.x} cy={s.y} r={tick%6===i?'6':'0'} fill="none" stroke={t.accent} strokeWidth="0.5" opacity="0.5"/>
              <text x={s.x} y={s.y+8} textAnchor="middle" fill={t.textMuted} fontSize="3" fontFamily="Space Grotesk">{s.label}</text>
            </g>
          ))}
        </svg>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
        {sensors.slice(0,3).map(s => (
          <div key={s.label} style={{ background:t.bg, border:`1px solid ${s.status==='warn'?'#E8A02033':t.accent+'18'}`, borderRadius:8, padding:'8px 10px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4 }}>
              <Icon name={s.icon} size={12} color={s.status==='warn'?'#E8A020':t.accent}/>
              <span style={{ color:t.textMuted, fontSize:9, fontFamily:"'Space Grotesk',sans-serif" }}>{s.label}</span>
            </div>
            <div style={{ color:s.status==='warn'?'#E8A020':t.accent, fontWeight:700, fontSize:13, fontFamily:"'Space Grotesk',sans-serif" }}>{s.value}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [themeKey, setThemeKey] = useState(getSavedTheme);
  const [demo, setDemo] = useState(false);
  const t = THEMES[themeKey];
  useEffect(() => { document.body.style.background = t.bg; }, [t.bg]);
  const [featRef, featVis] = useInView(0.1);
  const [ucRef, ucVis] = useInView(0.1);

  const features = [
    ['Zap','Smart Office Automation','Lighting, HVAC, access control and meeting room management driven by occupancy sensors and usage data.'],
    ['Activity','Energy Monitoring','Sub-meter energy tracking, anomaly detection and automated demand response to cut utility bills by 40%.'],
    ['MapPin','Asset Tracking','Real-time GPS and BLE tracking of vehicles, equipment and high-value assets across facilities.'],
    ['Globe','Environmental Sensors','Temperature, humidity, air quality, noise and vibration monitoring with automated compliance alerts.'],
    ['RefreshCw','Remote Device Management','OTA firmware updates, remote diagnostics, health dashboards and predictive maintenance alerts.'],
    ['BarChart2','IoT Analytics Platform','Centralised data ingestion, time-series visualisation, KPI dashboards and exportable reports.'],
  ];

  return (
    <div style={{ background:t.bg, minHeight:'100vh' }}>
      <SharedNavbar theme={t} onDemo={() => setDemo(true)}/>
      <section style={{ minHeight:'100vh', display:'flex', alignItems:'center', background:t.bg, position:'relative', overflow:'hidden', paddingTop:80 }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`radial-gradient(circle, ${t.accent}08 1px, transparent 1px)`, backgroundSize:'32px 32px' }}/>
        <div style={{ position:'absolute', top:'20%', right:'10%', width:300, height:300, borderRadius:'50%', background:`${t.accent}0A`, filter:'blur(60px)' }}/>
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'40px 5% 80px', width:'100%', position:'relative' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:64, alignItems:'center' }} className="hero-split">
            <div>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:`${t.accent}18`, border:`1px solid ${t.accent}44`, borderRadius:100, padding:'6px 16px', marginBottom:24 }}>
                <Icon name="Wifi" size={12} color={t.accent}/>
                <span style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:12, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase' }}>IoT & Smart Systems</span>
              </div>
              <h1 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(34px,4.5vw,60px)', fontWeight:800, color:t.text, lineHeight:1.05, letterSpacing:'-0.03em', marginBottom:24 }}>
                Connect Your<br /><span style={{ color:t.accent }}>Physical World.</span><br />Control It All.
              </h1>
              <p style={{ color:t.textMuted, fontSize:17, lineHeight:1.75, maxWidth:460, marginBottom:36 }}>
                Smart offices, energy systems, sensor networks and connected devices — all on a single intelligent platform. Monitor, control and optimise your physical infrastructure in real time.
              </p>
              <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:48 }}>
                <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'14px 28px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 30px ${t.accent}44` }}>Get a Free Consultation</button>
                <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.text, border:`1px solid ${t.accent}44`, borderRadius:8, padding:'14px 24px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
                {[['40%','Energy Savings'],['50+','Device Types'],['99.9%','Platform Uptime']].map(([v,l]) => (
                  <div key={l} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:10, padding:'16px', textAlign:'center' }}>
                    <div style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:800 }}>{v}</div>
                    <div style={{ color:t.textMuted, fontSize:11, marginTop:4 }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
            <div><SmartBuildingVisual theme={t}/></div>
          </div>
        </div>
      </section>
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}><SectionLabel theme={t} label="Capabilities"/><SectionHeading theme={t} sub="Full-stack IoT from hardware to dashboard.">What We Connect</SectionHeading></div>
          <div ref={featRef} style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }} className="grid-3">
            {features.map(([icon,title,desc],i) => <FeatureCard key={title} theme={t} icon={icon} title={title} desc={desc} delay={i*0.08} visible={featVis}/>)}
          </div>
        </div>
      </section>
      <section style={{ background:t.bg, padding:'90px 5%' }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}><SectionLabel theme={t} label="Deployments"/><SectionHeading theme={t} sub="Proven IoT deployments across sectors.">Where We Deploy It</SectionHeading></div>
          <div ref={ucRef} style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:20 }} className="grid-2">
            {[
              ['Building2','Corporate HQ Smart Office','Full smart building deployment — lighting, HVAC, meeting rooms and access control. 38% energy reduction, 25% improved space utilisation.','Corporate','38% energy saved'],
              ['Factory','Manufacturing Predictive Maintenance','IoT sensor network on 200+ machines — reduced unplanned downtime from 18% to under 3% via predictive maintenance alerts.','Manufacturing','18% → 3% downtime'],
              ['Globe','Smart City Sensor Network','Municipal environmental and traffic sensor network covering air quality, noise levels and waste management across a major city.','Government','City-wide coverage'],
              ['ShoppingCart','Retail Chain Monitoring','In-store footfall, temperature and equipment monitoring across 40 branches from a single dashboard with automated alerts.','Retail','40 branches live'],
            ].map(([icon,title,desc,tag,stat],i) => (
              <div key={title} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:16, padding:'28px', opacity:ucVis?1:0, transform:ucVis?'none':'translateY(20px)', transition:`all 0.6s ease ${i*0.1}s` }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=`${t.accent}55`;e.currentTarget.style.transform='translateY(-4px)';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=`${t.accent}22`;e.currentTarget.style.transform='none';}}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8 }}>
                  <div style={{ width:44, height:44, borderRadius:10, background:`${t.accent}18`, border:`1px solid ${t.accent}33`, display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name={icon} size={20} color={t.accent}/></div>
                  <div style={{ display:'flex', gap:8 }}>
                    <span style={{ background:`${t.accent}18`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase' }}>{tag}</span>
                    <span style={{ background:`${t.accent}33`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:11, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>{stat}</span>
                  </div>
                </div>
                <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:700, color:t.text, marginBottom:10 }}>{title}</h3>
                <p style={{ color:t.textMuted, fontSize:14, lineHeight:1.65 }}>{desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
      <section style={{ background:t.bgAlt, padding:'80px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:700, margin:'0 auto', textAlign:'center' }}>
          <SectionLabel theme={t} label="Get Started"/>
          <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(28px,4vw,44px)', fontWeight:800, color:t.text, letterSpacing:'-0.03em', marginBottom:20 }}>Ready to Build a <span style={{ color:t.accent }}>Smarter Facility?</span></h2>
          <p style={{ color:t.textMuted, fontSize:16, lineHeight:1.7, marginBottom:36 }}>Our engineers will design a connected system architecture tailored to your building, assets and business goals.</p>
          <div style={{ display:'flex', gap:16, justifyContent:'center', flexWrap:'wrap' }}>
            <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 40px ${t.accent}44` }}>Book a Free Consultation</button>
            <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.accent, border:`1px solid ${t.accent}55`, borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
          </div>
        </div>
      </section>
      <SharedFooter theme={t}/>{demo && <SharedDemoModal theme={t} onClose={() => setDemo(false)}/>}
      <SharedThemeSwitcher current={themeKey} onChange={k=>{setThemeKey(k);saveTheme(k);}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
