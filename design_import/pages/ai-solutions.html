<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── NEURAL NETWORK HERO VISUAL ──────────────────────────────────────────────
function NeuralHeroVisual({ theme: t }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId, phase = 0;
    const layers = [[.1],[.25,.45,.65,.85],[.2,.4,.6,.8],[.3,.5,.7],[.5]];
    const xPos = [0.08, 0.28, 0.52, 0.74, 0.94];
    const nodes = layers.flatMap((ys, li) => ys.map((y, ni) => ({ x: xPos[li], y, li, ni, id: `${li}-${ni}` })));
    const edges = [];
    nodes.forEach(n => nodes.filter(m => m.li === n.li + 1).forEach(m => edges.push([n, m])));

    function resize() {
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
    }
    function draw() {
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);
      phase += 0.02;
      edges.forEach(([a, b]) => {
        const sig = Math.sin(phase - a.x * 12) * 0.5 + 0.5;
        const grd = ctx.createLinearGradient(a.x*w, a.y*h, b.x*w, b.y*h);
        grd.addColorStop(0, t.accent + Math.floor(sig * 80 + 10).toString(16).padStart(2,'0'));
        grd.addColorStop(1, t.accent + Math.floor(sig * 50 + 10).toString(16).padStart(2,'0'));
        ctx.beginPath(); ctx.moveTo(a.x*w, a.y*h); ctx.lineTo(b.x*w, b.y*h);
        ctx.strokeStyle = grd; ctx.lineWidth = 1.2; ctx.stroke();
      });
      nodes.forEach(n => {
        const pulse = Math.sin(phase - n.x * 8 + n.y * 4) * 0.5 + 0.5;
        const r = 6 + pulse * 4;
        const grd = ctx.createRadialGradient(n.x*w, n.y*h, 0, n.x*w, n.y*h, r*3);
        grd.addColorStop(0, t.accent + 'cc');
        grd.addColorStop(1, t.accent + '00');
        ctx.beginPath(); ctx.arc(n.x*w, n.y*h, r*3, 0, Math.PI*2);
        ctx.fillStyle = grd; ctx.fill();
        ctx.beginPath(); ctx.arc(n.x*w, n.y*h, r, 0, Math.PI*2);
        ctx.fillStyle = t.accent + Math.floor(pulse * 200 + 55).toString(16).padStart(2,'0');
        ctx.fill();
        // label on output node
        if (n.li === 4) {
          const labels = ['Classify', 'Predict', 'Detect'];
          const lbl = labels[n.ni] || '';
          ctx.fillStyle = t.accent; ctx.font = `bold ${Math.round(w*0.022)}px Space Grotesk, sans-serif`;
          ctx.fillText(lbl, n.x*w + 12, n.y*h + 4);
        }
        if (n.li === 0) {
          const labels = ['Data'];
          ctx.fillStyle = t.textMuted; ctx.font = `${Math.round(w*0.018)}px Space Grotesk, sans-serif`;
          ctx.fillText(labels[0] || '', n.x*w - 32, n.y*h + 4);
        }
      });
      // floating accuracy badge
      const bx = w*0.5, by = h*0.06;
      ctx.fillStyle = t.accent + '22';
      ctx.beginPath(); ctx.roundRect(bx-52, by-12, 104, 26, 6); ctx.fill();
      ctx.fillStyle = t.accent; ctx.font = `bold ${Math.round(w*0.022)}px Space Grotesk`;
      ctx.textAlign = 'center'; ctx.fillText('98.4% Accuracy', bx, by+6); ctx.textAlign = 'left';
      animId = requestAnimationFrame(draw);
    }
    resize(); draw();
    window.addEventListener('resize', resize);
    return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
  }, [t.accent, t.textMuted]);

  return (
    <div style={{ position:'relative', borderRadius:20, overflow:'hidden', background:`${t.accent}08`, border:`1px solid ${t.accent}22` }}>
      <canvas ref={canvasRef} style={{ width:'100%', height:380, display:'block' }} />
      <div style={{ position:'absolute', bottom:16, left:16, right:16, display:'flex', gap:8, flexWrap:'wrap' }}>
        {['Input Layer','Hidden × 2','Output Layer'].map((l,i) => (
          <span key={l} style={{ background:`${t.accent}22`, color:t.accent, borderRadius:6, padding:'4px 12px', fontSize:11, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>{l}</span>
        ))}
      </div>
    </div>
  );
}

// ── MODEL ACCURACY GAUGE ──────────────────────────────────────────────────────
function AccuracyGauge({ theme: t, value, label }) {
  const [v, setV] = useState(0);
  useEffect(() => { const t2 = setTimeout(() => setV(value), 400); return () => clearTimeout(t2); }, [value]);
  const angle = (v / 100) * 180 - 90;
  const r = 44; const cx = 60; const cy = 60;
  const arcX = cx + r * Math.cos((angle - 90) * Math.PI / 180);
  const arcY = cy + r * Math.sin((angle - 90) * Math.PI / 180);
  return (
    <div style={{ textAlign:'center', padding:'24px 16px', background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:14 }}>
      <svg viewBox="0 0 120 70" style={{ width:'100%', maxWidth:120 }}>
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke={`${t.accent}22`} strokeWidth="8" strokeLinecap="round"/>
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${arcX} ${arcY}`} fill="none" stroke={t.accent} strokeWidth="8" strokeLinecap="round" style={{ transition:'all 1.2s ease' }}/>
        <text x={cx} y={cy-4} textAnchor="middle" fill={t.accent} fontSize="14" fontWeight="800" fontFamily="Space Grotesk">{v}%</text>
      </svg>
      <div style={{ color:t.text, fontFamily:"'Space Grotesk',sans-serif", fontSize:13, fontWeight:600, marginTop:4 }}>{label}</div>
    </div>
  );
}

function App() {

        <div style={{ position:'absolute', bottom:0, left:0, right:0, height:'40%', background:`linear-gradient(to top, ${t.bg}, transparent)` }} />
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'40px 5% 80px', width:'100%', position:'relative' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:72, alignItems:'center' }} className="hero-split">
            <div>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:`${t.accent}18`, border:`1px solid ${t.accent}44`, borderRadius:100, padding:'6px 16px', marginBottom:24 }}>
                <div style={{ width:6, height:6, borderRadius:'50%', background:t.accent, boxShadow:`0 0 8px ${t.accent}` }} />
                <span style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:12, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase' }}>AI & Machine Learning</span>
              </div>
              <h1 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(36px,4.5vw,62px)', fontWeight:800, color:t.text, lineHeight:1.05, letterSpacing:'-0.03em', marginBottom:24 }}>
                AI That Learns<br /><span style={{ color:t.accent }}>Your Business.</span><br />Not Someone Else's.
              </h1>
              <p style={{ color:t.textMuted, fontSize:17, lineHeight:1.75, maxWidth:460, marginBottom:36 }}>

              </p>
              <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:48 }}>
                <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'14px 28px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 30px ${t.accent}44` }}>
                  Get a Free Consultation
                </button>
                <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.text, border:`1px solid ${t.accent}44`, borderRadius:8, padding:'14px 24px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
              </div>
              {/* Gauges */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>

            </div>
            <div><NeuralHeroVisual theme={t} /></div>
          </div>

      </section>

      {/* FEATURES */}
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Capabilities" />
            <SectionHeading theme={t} sub="Every system engineered end-to-end for your industry context.">What We Build</SectionHeading>
          </div>
          <div ref={featRef} style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }} className="grid-3">
            {features.map(([icon, title, desc], i) => (
              <FeatureCard key={title} theme={t} icon={icon} title={title} desc={desc} delay={i*0.08} visible={featVis} />

      {/* USE CASES with visual */}
      <section style={{ background:t.bg, padding:'90px 5%' }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>

          </div>

            {[

                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8 }}>
                  <div style={{ width:44,height:44,borderRadius:10,background:`${t.accent}18`,border:`1px solid ${t.accent}33`,display:'flex',alignItems:'center',justifyContent:'center',color:t.accent }}><Icon name={icon} size={20} color={t.accent}/></div>
                  <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
                    <span style={{ background:`${t.accent}18`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase' }}>{tag}</span>
                    <span style={{ background:`${t.accent}33`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:11, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>{stat}</span>

            ))}
          </div>
        </div>
      </section>

      {/* PROCESS */}
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>

              <div key={n} style={{ padding:'0 20px', textAlign:'center' }}>
