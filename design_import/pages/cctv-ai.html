<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCTV AI Systems — Krucial Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../shared/icons.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}body{overflow-x:hidden;}
    @media(max-width:900px){.nav-links{display:none!important}.hamburger{display:flex!important;flex-direction:column}.hero-split{grid-template-columns:1fr!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr 1fr!important}.grid-4{grid-template-columns:1fr 1fr!important}.footer-grid{grid-template-columns:1fr 1fr!important}}
    @media(max-width:600px){.grid-3,.grid-4,.footer-grid{grid-template-columns:1fr!important}}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#05060F}::-webkit-scrollbar-thumb{background:#0A84FF55;border-radius:3px}
    @keyframes scanline { 0%{top:-5%} 100%{top:105%} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes pulse-ring { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(2.5);opacity:0} }
  </style>
</head>
<body><div id="root"></div>
<script src="../shared/themes.js"></script>
<script type="text/babel" src="../shared/layout.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── CCTV HERO VISUAL ─────────────────────────────────────────────────────────
function CCTVHeroVisual({ theme: t }) {
  const [tick, setTick] = useState(0);
  const [scanY, setScanY] = useState(0);
  const [alert, setAlert] = useState(false);

  useEffect(() => {
    const id = setInterval(() => setTick(x => x + 1), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    let y = 0; let dir = 1;
    const id = setInterval(() => {
      y += dir * 1.5;
      if (y > 100) dir = -1;
      if (y < 0) dir = 1;
      setScanY(y);
    }, 30);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const id = setInterval(() => setAlert(a => !a), 3000);
    return () => clearInterval(id);
  }, []);

  const camFeeds = [
    { label:'CAM 01 — Entrance', persons: 2, status:'active' },
    { label:'CAM 02 — Warehouse', persons: 0, status:'active' },
    { label:'CAM 03 — Parking', persons: 1, status:'alert' },
    { label:'CAM 04 — Server Room', persons: 0, status:'active' },
  ];

  const detectionBoxes = [
    { x:18, y:25, w:28, h:45, label:'Person', conf:96, color: t.accent },
    { x:55, y:30, w:22, h:38, label:'Person', conf:91, color: t.accent },
    { x:68, y:55, w:18, h:25, label:'Bag', conf:84, color: '#E8A020' },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:10, userSelect:'none' }}>
      {/* Main camera feed */}
      <div style={{ position:'relative', background:'#050810', border:`2px solid ${t.accent}44`, borderRadius:12, overflow:'hidden', aspectRatio:'16/9' }}>
        {/* Grid overlay */}
        <div style={{ position:'absolute', inset:0, backgroundImage:`linear-gradient(${t.accent}10 1px,transparent 1px),linear-gradient(90deg,${t.accent}10 1px,transparent 1px)`, backgroundSize:'32px 32px' }} />
        {/* Scanline */}
        <div style={{ position:'absolute', left:0, right:0, top:`${scanY}%`, height:2, background:`linear-gradient(90deg,transparent,${t.accent}88,transparent)`, pointerEvents:'none' }} />
        {/* Detection boxes */}
        {detectionBoxes.map((box, i) => (
          <div key={i} style={{ position:'absolute', left:`${box.x}%`, top:`${box.y}%`, width:`${box.w}%`, height:`${box.h}%`, border:`2px solid ${box.color}`, borderRadius:2 }}>
            <div style={{ position:'absolute', top:-18, left:0, background:`${box.color}dd`, borderRadius:3, padding:'2px 6px', fontSize:10, color:'#000', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, whiteSpace:'nowrap' }}>{box.label} {box.conf}%</div>
            {/* Corner marks */}
            {[[0,0,'0,0','8,0 0,0 0,8'],[100,0,'right,0','100%,0 100%,8'],[0,100,'0,bottom','0,100% 8,100%'],[100,100,'right,bottom','100%,100% 92%,100% 100%,92%']].map((_,ci) => (
              <div key={ci} style={{ position:'absolute', ...(ci===0?{top:0,left:0}:ci===1?{top:0,right:0}:ci===2?{bottom:0,left:0}:{bottom:0,right:0}), width:8, height:8, borderTop: ci<2 ? `2px solid ${box.color}` : 'none', borderBottom: ci>=2 ? `2px solid ${box.color}` : 'none', borderLeft: ci%2===0 ? `2px solid ${box.color}` : 'none', borderRight: ci%2===1 ? `2px solid ${box.color}` : 'none' }} />
            ))}
          </div>
        ))}
        {/* Alert pulse */}
        {alert && (
          <div style={{ position:'absolute', top:12, right:12, display:'flex', alignItems:'center', gap:6, background:'#FF4444dd', borderRadius:6, padding:'4px 10px' }}>
            <div style={{ width:6, height:6, borderRadius:'50%', background:'#fff', animation:'blink 1s infinite' }} />
            <span style={{ color:'#fff', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>MOTION ALERT</span>
          </div>
        )}
        {/* Camera info */}
        <div style={{ position:'absolute', bottom:8, left:10, color:`${t.accent}cc`, fontSize:10, fontFamily:"'Space Grotesk',sans-serif" }}>CAM_03 · 4K · {new Date().toLocaleTimeString()}</div>
        <div style={{ position:'absolute', top:8, left:10, display:'flex', alignItems:'center', gap:6 }}>
          <div style={{ width:6, height:6, borderRadius:'50%', background:'#00C896', boxShadow:'0 0 6px #00C896', animation:'blink 2s infinite' }} />
          <span style={{ color:'#00C896', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>LIVE · AI ACTIVE</span>
        </div>
      </div>

      {/* 4-camera grid */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6 }}>
        {camFeeds.map((cam, i) => (
          <div key={i} style={{ background:'#050810', border:`1px solid ${cam.status==='alert'?t.accent+'88':t.accent+'22'}`, borderRadius:8, padding:'8px', position:'relative', overflow:'hidden' }}>
            <div style={{ background:`${t.accent}10`, borderRadius:4, height:36, marginBottom:6, display:'flex', alignItems:'center', justifyContent:'center', position:'relative' }}>
              <Icon name="Camera" size={14} color={t.accent} />
              {cam.status==='alert' && <div style={{ position:'absolute', inset:0, borderRadius:4, border:`1px solid ${t.accent}`, animation:'blink 1s infinite' }} />}
            </div>
            <div style={{ color:t.textMuted, fontSize:9, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1.3 }}>{cam.label}</div>
            {cam.persons > 0 && <div style={{ color:t.accent, fontSize:9, fontWeight:700, marginTop:2 }}>{cam.persons} person{cam.persons>1?'s':''} detected</div>}
          </div>
        ))}
      </div>

      {/* Stats strip */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6 }}>
        {[['14,892','Events Today'],['99.7%','Accuracy'],['< 3s','Alert Time'],['4K','Resolution']].map(([v,l])=>(
          <div key={l} style={{ background:`${t.accent}0A`, border:`1px solid ${t.accent}22`, borderRadius:8, padding:'8px', textAlign:'center' }}>
            <div style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:14, fontWeight:800 }}>{v}</div>
            <div style={{ color:t.textMuted, fontSize:9, marginTop:2 }}>{l}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [themeKey, setThemeKey] = useState(getSavedTheme);
  const [demo, setDemo] = useState(false);
  const t = THEMES[themeKey];
  useEffect(() => { document.body.style.background = t.bg; }, [t.bg]);
  const [featRef, featVis] = useInView(0.1);
  const [ucRef, ucVis] = useInView(0.1);

  const features = [
    ['Eye','Facial Recognition','Identify persons of interest, manage access control and track movement patterns across multi-camera networks in real time.'],
    ['Shield','Intrusion Detection','Perimeter breach, restricted zone entry and after-hours activity — instant alerts to operators and security teams within 3 seconds.'],
    ['HardHat','PPE Compliance','Automated detection of hard hats, vests, masks and gloves on construction, industrial and warehouse sites with daily compliance reports.'],
    ['Camera','License Plate Recognition','Capture, log and cross-reference vehicle plates across entry/exit points. Integrated watchlist alerts and export to security systems.'],
    ['Users','Crowd & Footfall Analytics','Real-time people counting, heatmapping, queue detection and dwell time analysis for retail, events and public spaces.'],
    ['BarChart2','Video Analytics Dashboard','Centralized command dashboard with live feeds, incident logs, trend analytics, AI confidence scores and exportable compliance reports.'],
  ];

  return (
    <div style={{ background:t.bg, minHeight:'100vh' }}>
      <SharedNavbar theme={t} onDemo={() => setDemo(true)} />

      {/* HERO */}
      <section style={{ minHeight:'100vh', display:'flex', alignItems:'center', background:t.bg, position:'relative', overflow:'hidden', paddingTop:80 }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`repeating-linear-gradient(0deg, ${t.accent}04 0px, ${t.accent}04 1px, transparent 1px, transparent 40px), repeating-linear-gradient(90deg, ${t.accent}04 0px, ${t.accent}04 1px, transparent 1px, transparent 40px)` }} />
        <div style={{ position:'absolute', top:'20%', left:'5%', width:300, height:300, borderRadius:'50%', background:`${t.accent}08`, filter:'blur(60px)' }} />
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'40px 5% 80px', width:'100%', position:'relative' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:64, alignItems:'center' }} className="hero-split">
            <div>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:`${t.accent}18`, border:`1px solid ${t.accent}44`, borderRadius:100, padding:'6px 16px', marginBottom:24 }}>
                <div style={{ width:6, height:6, borderRadius:'50%', background:t.accent, boxShadow:`0 0 8px ${t.accent}`, animation:'blink 2s infinite' }} />
                <span style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:12, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase' }}>CCTV AI — Live Intelligence</span>
              </div>
              <h1 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(34px,4.5vw,60px)', fontWeight:800, color:t.text, lineHeight:1.05, letterSpacing:'-0.03em', marginBottom:24 }}>
                Every Camera.<br /><span style={{ color:t.accent }}>An Intelligent</span><br />Sensor.
              </h1>
              <p style={{ color:t.textMuted, fontSize:17, lineHeight:1.75, maxWidth:460, marginBottom:36 }}>
                Transform your existing CCTV infrastructure into a real-time AI detection system. Facial recognition, intrusion alerts, PPE compliance, crowd analytics — all from one platform.
              </p>
              <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:48 }}>
                <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'14px 28px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 30px ${t.accent}44` }}>Get a Free Consultation</button>
                <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.text, border:`1px solid ${t.accent}44`, borderRadius:8, padding:'14px 24px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
                {[['35%','Loss Reduction'],['< 3s','Alert Time'],['99.7%','Detection Accuracy']].map(([v,l]) => (
                  <div key={l} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:10, padding:'16px', textAlign:'center' }}>
                    <div style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:800 }}>{v}</div>
                    <div style={{ color:t.textMuted, fontSize:11, marginTop:4 }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
            <div><CCTVHeroVisual theme={t} /></div>
          </div>
        </div>
      </section>

      {/* FEATURES */}
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Capabilities" />
            <SectionHeading theme={t} sub="AI detection modules that work 24/7 without fatigue.">What the System Detects</SectionHeading>
          </div>
          <div ref={featRef} style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }} className="grid-3">
            {features.map(([icon,title,desc],i) => (
              <FeatureCard key={title} theme={t} icon={icon} title={title} desc={desc} delay={i*0.08} visible={featVis} />
            ))}
          </div>
        </div>
      </section>

      {/* USE CASES */}
      <section style={{ background:t.bg, padding:'90px 5%' }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Deployments" />
            <SectionHeading theme={t} sub="Real results from live CCTV AI installations.">Where We Deploy It</SectionHeading>
          </div>
          <div ref={ucRef} style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:20 }} className="grid-2">
            {[
              ['ShoppingCart','Retail Loss Prevention','AI flagging of suspicious behavior, shelf anomaly detection and till-side monitoring. 35% average loss reduction within 90 days across 12-branch retail chains.','Retail','35% loss reduction'],
              ['HardHat','Construction Site Safety','PPE detection on hard hats, vests, masks and gloves — reducing safety incidents by 60% on active project sites with zero false penalty tolerance.','Construction','92% PPE compliance'],
              ['Building2','Smart City Surveillance','Multi-camera city monitoring with integrated LPR, crowd density analytics and real-time incident dispatch for municipal authorities.','Government','28% faster response'],
              ['Landmark','Bank & ATM Security','24/7 ATM monitoring, tailgating and loitering detection with real-time alerts to security operations centres and automatic incident logging.','Banking','Zero undetected incidents'],
            ].map(([icon,title,desc,tag,stat],i) => (
              <div key={title} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:16, padding:'28px', opacity:ucVis?1:0, transform:ucVis?'none':'translateY(20px)', transition:`all 0.6s ease ${i*0.1}s` }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=`${t.accent}55`;e.currentTarget.style.transform='translateY(-4px)';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=`${t.accent}22`;e.currentTarget.style.transform='none';}}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8 }}>
                  <div style={{ width:44, height:44, borderRadius:10, background:`${t.accent}18`, border:`1px solid ${t.accent}33`, display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <Icon name={icon} size={20} color={t.accent} />
                  </div>
                  <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                    <span style={{ background:`${t.accent}18`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase' }}>{tag}</span>
                    <span style={{ background:`${t.accent}33`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:11, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>{stat}</span>
                  </div>
                </div>
                <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:700, color:t.text, marginBottom:10 }}>{title}</h3>
                <p style={{ color:t.textMuted, fontSize:14, lineHeight:1.65 }}>{desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PROCESS */}
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Deployment Process" />
            <SectionHeading theme={t}>From Site Survey to Live Monitoring</SectionHeading>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:0, position:'relative' }} className="grid-4">
            <div style={{ position:'absolute', top:32, left:'12.5%', right:'12.5%', height:1, background:`linear-gradient(90deg,transparent,${t.accent}44,transparent)` }} />
            {[['01','Site Survey','Camera placement audit, network assessment and coverage gap analysis for optimal detection zones.'],['02','Hardware Setup','Install AI-enabled cameras, edge GPU nodes, NVR systems and network infrastructure.'],['03','AI Calibration','Configure detection zones, sensitivity thresholds, alert routing and watchlist integration.'],['04','Command Centre','Live monitoring dashboard, incident management, compliance reports and 24/7 support.']].map(([n,title,desc]) => (
              <div key={n} style={{ padding:'0 20px', textAlign:'center' }}>
                <div style={{ width:64, height:64, borderRadius:'50%', background:t.bg, border:`2px solid ${t.accent}`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 24px', zIndex:1, position:'relative' }}>
                  <span style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:16, fontWeight:800, color:t.accent }}>{n}</span>
                </div>
                <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:17, fontWeight:700, color:t.text, marginBottom:10 }}>{title}</h3>
                <p style={{ color:t.textMuted, fontSize:13, lineHeight:1.65 }}>{desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{ background:t.bg, padding:'90px 5%' }}>
        <div style={{ maxWidth:700, margin:'0 auto', textAlign:'center' }}>
          <SectionLabel theme={t} label="Get Started" />
          <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(28px,4vw,44px)', fontWeight:800, color:t.text, letterSpacing:'-0.03em', marginBottom:20 }}>Ready to Make Your <span style={{ color:t.accent }}>Cameras Intelligent?</span></h2>
          <p style={{ color:t.textMuted, fontSize:16, lineHeight:1.7, marginBottom:36 }}>We start with a free site survey — our engineers will assess your current infrastructure and design an AI overlay system within 48 hours.</p>
          <div style={{ display:'flex', gap:16, justifyContent:'center', flexWrap:'wrap' }}>
            <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 40px ${t.accent}44` }}>Book a Free Site Survey</button>
            <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.accent, border:`1px solid ${t.accent}55`, borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
          </div>
        </div>
      </section>

      <SharedFooter theme={t} />
      {demo && <SharedDemoModal theme={t} onClose={() => setDemo(false)} />}
      <SharedThemeSwitcher current={themeKey} onChange={k => { setThemeKey(k); saveTheme(k); }} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
