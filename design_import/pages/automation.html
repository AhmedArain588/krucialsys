<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Intelligent Automation — Krucial Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../shared/icons.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}body{overflow-x:hidden;}@media(max-width:900px){.nav-links{display:none!important}.hamburger{display:flex!important;flex-direction:column}.hero-split{grid-template-columns:1fr!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr 1fr!important}.grid-4{grid-template-columns:1fr 1fr!important}.footer-grid{grid-template-columns:1fr 1fr!important}}@media(max-width:600px){.grid-3,.grid-4,.footer-grid{grid-template-columns:1fr!important}}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#05060F}::-webkit-scrollbar-thumb{background:#0A84FF55;border-radius:3px}</style>
</head><body><div id="root"></div>
<script src="../shared/themes.js"></script>
<script type="text/babel" src="../shared/layout.jsx"></script>
<script type="text/babel">

const { useState, useEffect } = React;

function WorkflowVisual({ theme: t }) {
  const [active, setActive] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setActive(a => (a + 1) % 5), 1400);
    return () => clearInterval(id);
  }, []);

  const steps = [
    { x: 8, y: 42, label: 'Trigger', icon: 'Zap', w: 18 },
    { x: 32, y: 20, label: 'Fetch Data', icon: 'Database', w: 18 },
    { x: 32, y: 64, label: 'Validate', icon: 'CheckCircle', w: 18 },
    { x: 58, y: 42, label: 'Process', icon: 'Cpu', w: 18 },
    { x: 82, y: 42, label: 'Output', icon: 'ArrowRight', w: 18 },
  ];
  const edges = [[0,1],[0,2],[1,3],[2,3],[3,4]];

  return (
    <div style={{ background: t.bgAlt, border: `1px solid ${t.accent}33`, borderRadius: 16, padding: 24, fontFamily: "'Space Grotesk',sans-serif" }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <span style={{ color:t.text, fontWeight:700, fontSize:14 }}>Workflow Automation Engine</span>
        <span style={{ color:'#00C896', fontSize:11, background:'#00C89622', borderRadius:100, padding:'3px 10px', fontWeight:700 }}>● RUNNING</span>
      </div>
      <svg viewBox="0 0 100 90" style={{ width:'100%', height:160, marginBottom:16 }}>
        {edges.map(([a, b], i) => {
          const from = steps[a], to = steps[b];
          const isActive = active === a || active === b;
          return (
            <line key={i}
              x1={from.x + from.w/2} y1={from.y + 8}
              x2={to.x + to.w/2} y2={to.y + 8}
              stroke={isActive ? t.accent : t.accent + '33'}
              strokeWidth={isActive ? '1.5' : '0.8'}
              strokeDasharray={isActive ? 'none' : '2,2'}
              style={{ transition: 'stroke 0.3s' }}
            />
          );
        })}
        {steps.map((s, i) => {
          const isActive = active === i;
          return (
            <g key={i}>
              <rect x={s.x} y={s.y} width={s.w} height={16} rx="3"
                fill={isActive ? t.accent + '33' : t.accent + '10'}
                stroke={isActive ? t.accent : t.accent + '44'}
                strokeWidth="1"
                style={{ transition: 'all 0.3s' }}
              />
              <text x={s.x + s.w/2} y={s.y + 10} textAnchor="middle"
                fill={isActive ? t.accent : t.textMuted}
                fontSize="4" fontFamily="Space Grotesk" fontWeight={isActive ? '700' : '400'}>
                {s.label}
              </text>
            </g>
          );
        })}
      </svg>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:8 }}>
        {[['Bots Running','12 active'],['Tasks Today','8,492'],['Avg. Handle Time','0.8s'],['Error Rate','0.02%']].map(([l,v]) => (
          <div key={l} style={{ background:t.bg, border:`1px solid ${t.accent}18`, borderRadius:8, padding:'10px 12px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ color:t.textMuted, fontSize:11 }}>{l}</span>
            <span style={{ color:t.accent, fontWeight:700, fontSize:12 }}>{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [themeKey, setThemeKey] = useState(getSavedTheme);
  const [demo, setDemo] = useState(false);
  const t = THEMES[themeKey];
  useEffect(() => { document.body.style.background = t.bg; }, [t.bg]);
  const [featRef, featVis] = useInView(0.1);
  const [ucRef, ucVis] = useInView(0.1);

  const features = [
    ['Cpu','Robotic Process Automation','Software bots replicate human actions — login, extract, copy, submit — across any application, 24/7 with zero errors.'],
    ['GitMerge','Workflow Orchestration','Design multi-step business processes with conditional branching, exception handling and human-in-the-loop approval gates.'],
    ['BarChart2','Smart Dashboards','Real-time operational KPIs, bot performance metrics, SLA tracking and exception queues — all on one live command dashboard.'],
    ['FileText','Document Automation','Auto-generate invoices, contracts, reports and compliance documents from structured data — no manual drafting required.'],
    ['Network','Process Mining','Discover hidden inefficiencies using event log analysis — identify bottlenecks, deviations and automation candidates automatically.'],
    ['Link','System Integration','Connect ERP, CRM, HRMS and custom apps via API bridges — no rip-and-replace. Automation works around your existing stack.'],
  ];

  return (
    <div style={{ background:t.bg, minHeight:'100vh' }}>
      <SharedNavbar theme={t} onDemo={() => setDemo(true)} />
      <section style={{ minHeight:'100vh', display:'flex', alignItems:'center', background:t.bg, position:'relative', overflow:'hidden', paddingTop:80 }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`linear-gradient(${t.accent}05 1px,transparent 1px),linear-gradient(90deg,${t.accent}05 1px,transparent 1px)`, backgroundSize:'48px 48px' }} />
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'40px 5% 80px', width:'100%', position:'relative' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:64, alignItems:'center' }} className="hero-split">
            <div>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:`${t.accent}18`, border:`1px solid ${t.accent}44`, borderRadius:100, padding:'6px 16px', marginBottom:24 }}>
                <Icon name="Zap" size={12} color={t.accent} />
                <span style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:12, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase' }}>Intelligent Automation</span>
              </div>
              <h1 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(34px,4.5vw,60px)', fontWeight:800, color:t.text, lineHeight:1.05, letterSpacing:'-0.03em', marginBottom:24 }}>
                Your Processes.<br /><span style={{ color:t.accent }}>Automated.</span><br />Perfected.
              </h1>
              <p style={{ color:t.textMuted, fontSize:17, lineHeight:1.75, maxWidth:460, marginBottom:36 }}>RPA bots, intelligent workflow orchestration and smart dashboards that eliminate manual work — running 24/7 without error, at a fraction of the cost.</p>
              <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:48 }}>
                <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'14px 28px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 30px ${t.accent}44` }}>Get a Free Consultation</button>
                <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.text, border:`1px solid ${t.accent}44`, borderRadius:8, padding:'14px 24px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
                {[['60%','Cost Reduction'],['10×','Process Speed'],['< 1%','Error Rate']].map(([v,l]) => (
                  <div key={l} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:10, padding:'16px', textAlign:'center' }}>
                    <div style={{ color:t.accent, fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:800 }}>{v}</div>
                    <div style={{ color:t.textMuted, fontSize:11, marginTop:4 }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
            <div><WorkflowVisual theme={t} /></div>
          </div>
        </div>
      </section>
      <section style={{ background:t.bgAlt, padding:'90px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Capabilities" />
            <SectionHeading theme={t} sub="End-to-end automation from trigger to output.">What We Automate</SectionHeading>
          </div>
          <div ref={featRef} style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }} className="grid-3">
            {features.map(([icon,title,desc],i) => <FeatureCard key={title} theme={t} icon={icon} title={title} desc={desc} delay={i*0.08} visible={featVis}/>)}
          </div>
        </div>
      </section>
      <section style={{ background:t.bg, padding:'90px 5%' }}>
        <div style={{ maxWidth:1280, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:56 }}>
            <SectionLabel theme={t} label="Applications" /><SectionHeading theme={t} sub="Deployed across industries.">Where We Automate</SectionHeading>
          </div>
          <div ref={ucRef} style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:20 }} className="grid-2">
            {[
              ['Landmark','KYC & Account Opening','Bank account opening automated from 72-hour manual review to 4-hour AI pipeline — 90% of documents processed without human touch.','Banking','72hrs → 4hrs'],
              ['Package','Logistics Dispatch','Automated order picking, dispatch scheduling and carrier selection reduced fulfilment time by 50% across a 200-vehicle fleet.','Logistics','50% faster dispatch'],
              ['Activity','Hospital Administration','Patient registration, appointment scheduling and insurance claims fully automated — 80% admin time saved across 400-bed hospital.','Healthcare','80% admin saved'],
              ['FileText','Invoice Processing','AP invoice extraction, PO matching and payment scheduling with zero manual touchpoints — 99.8% accuracy across 5,000 invoices/month.','Finance','Zero manual entry'],
            ].map(([icon,title,desc,tag,stat],i) => (
              <div key={title} style={{ background:t.bgAlt, border:`1px solid ${t.accent}22`, borderRadius:16, padding:'28px', opacity:ucVis?1:0, transform:ucVis?'none':'translateY(20px)', transition:`all 0.6s ease ${i*0.1}s` }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=`${t.accent}55`;e.currentTarget.style.transform='translateY(-4px)';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=`${t.accent}22`;e.currentTarget.style.transform='none';}}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8 }}>
                  <div style={{ width:44, height:44, borderRadius:10, background:`${t.accent}18`, border:`1px solid ${t.accent}33`, display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name={icon} size={20} color={t.accent}/></div>
                  <div style={{ display:'flex', gap:8 }}>
                    <span style={{ background:`${t.accent}18`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:10, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase' }}>{tag}</span>
                    <span style={{ background:`${t.accent}33`, color:t.accent, borderRadius:4, padding:'2px 10px', fontSize:11, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif" }}>{stat}</span>
                  </div>
                </div>
                <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:700, color:t.text, marginBottom:10 }}>{title}</h3>
                <p style={{ color:t.textMuted, fontSize:14, lineHeight:1.65 }}>{desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
      <section style={{ background:t.bgAlt, padding:'80px 5%', borderTop:`1px solid ${t.accent}22` }}>
        <div style={{ maxWidth:700, margin:'0 auto', textAlign:'center' }}>
          <SectionLabel theme={t} label="Get Started" />
          <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:'clamp(28px,4vw,44px)', fontWeight:800, color:t.text, letterSpacing:'-0.03em', marginBottom:20 }}>Ready to <span style={{ color:t.accent }}>Automate?</span></h2>
          <p style={{ color:t.textMuted, fontSize:16, lineHeight:1.7, marginBottom:36 }}>We start with a free process audit — identifying your top 3 automation opportunities and estimated ROI within 48 hours.</p>
          <div style={{ display:'flex', gap:16, justifyContent:'center', flexWrap:'wrap' }}>
            <button onClick={() => setDemo(true)} style={{ background:t.accent, color:t.accentText||'#fff', border:'none', borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer', boxShadow:`0 0 40px ${t.accent}44` }}>Book a Free Process Audit</button>
            <a href="services.html" style={{ display:'inline-flex', alignItems:'center', color:t.accent, border:`1px solid ${t.accent}55`, borderRadius:8, padding:'15px 32px', fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15, textDecoration:'none' }}>← All Services</a>
          </div>
        </div>
      </section>
      <SharedFooter theme={t}/>
      {demo && <SharedDemoModal theme={t} onClose={() => setDemo(false)}/>}
      <SharedThemeSwitcher current={themeKey} onChange={k => { setThemeKey(k); saveTheme(k); }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
