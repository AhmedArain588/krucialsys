<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── THEMES ───────────────────────────────────────────────────────────────────
const THEMES = {
  darkBlue: {
    name: 'Dark Tech Blue',
    bg: '#05060F',
    bgAlt: '#080A18',
    bgCard: '#0C0F1E',
    text: '#EEF0FF',
    textMuted: '#8892AA',
    accent: '#0A84FF',
    accentText: '#fff',
    logoFilter: 'invert(1) brightness(1)',
  },
  midnightGreen: {
    name: 'Midnight Green',
    bg: '#050E0B',
    bgAlt: '#071410',
    bgCard: '#0A1A14',
    text: '#E8F5F0',
    textMuted: '#7A9990',
    accent: '#00C896',
    accentText: '#000',
    logoFilter: 'invert(1)',
  },
  navyGold: {
    name: 'Corporate Navy',
    bg: '#F5F7FA',
    bgAlt: '#EAEEF4',
    bgCard: '#FFFFFF',
    text: '#0D1528',
    textMuted: '#5A6880',
    accent: '#1A3A8F',
    accentText: '#fff',
    logoFilter: 'none',
  },
  darkViolet: {
    name: 'Dark Violet',
    bg: '#0A080F',
    bgAlt: '#100C18',
    bgCard: '#160F22',
    text: '#F0ECFF',
    textMuted: '#8878AA',
    accent: '#9B6DFF',
    accentText: '#fff',
    logoFilter: 'invert(1)',
  },
  darkGold: {
    name: 'Dark Gold',
    bg: '#090807',
    bgAlt: '#110F0C',
    bgCard: '#181410',
    text: '#F5F0E8',
    textMuted: '#8A7D68',
    accent: '#E8A020',
    accentText: '#000',
    logoFilter: 'invert(1)',
  },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "darkBlue"
}/*EDITMODE-END*/;

// Floating theme switcher — always visible bottom-left
function ThemeSwitcher({ current, onChange }) {
  const [open, setOpen] = useState(false);
  const swatches = [
    { key: 'darkBlue',      color: '#0A84FF', label: 'Dark Blue' },
    { key: 'midnightGreen', color: '#00C896', label: 'Midnight Green' },
    { key: 'navyGold',      color: '#1A3A8F', label: 'Corporate Navy' },
    { key: 'darkViolet',    color: '#9B6DFF', label: 'Dark Violet' },
    { key: 'darkGold',      color: '#E8A020', label: 'Dark Gold' },
  ];
  const theme = THEMES[current];
  return (
    <div style={{ position: 'fixed', bottom: 28, left: 28, zIndex: 1500, display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 8 }}>
      {open && (
        <div style={{ background: theme.bgCard || theme.bgAlt, border: `1px solid ${theme.accent}44`, borderRadius: 14, padding: '16px 14px', display: 'flex', flexDirection: 'column', gap: 8, boxShadow: `0 20px 60px #00000066` }}>
          <div style={{ color: theme.textMuted, fontFamily: "'Space Grotesk', sans-serif", fontSize: 10, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 4 }}>Color Theme</div>
          {swatches.map(s => (
            <button key={s.key} onClick={() => { onChange(s.key); setOpen(false); }}
              style={{ display: 'flex', alignItems: 'center', gap: 10, background: current === s.key ? `${s.color}22` : 'transparent', border: `1px solid ${current === s.key ? s.color : 'transparent'}`, borderRadius: 8, padding: '8px 12px', cursor: 'pointer', transition: 'all 0.2s' }}>
              <div style={{ width: 14, height: 14, borderRadius: '50%', background: s.color, boxShadow: `0 0 8px ${s.color}88`, flexShrink: 0 }} />
              <span style={{ color: theme.text, fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontWeight: current === s.key ? 700 : 500, whiteSpace: 'nowrap' }}>{s.label}</span>
              {current === s.key && <span style={{ color: s.color, fontSize: 12, marginLeft: 'auto' }}>✓</span>}
            </button>
          ))}
        </div>
      )}
      <button onClick={() => setOpen(o => !o)}
        style={{ width: 44, height: 44, borderRadius: '50%', background: theme.accent, border: `2px solid ${theme.accent}`, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 0 20px ${theme.accent}66`, transition: 'all 0.3s', fontSize: 18 }}
        title="Change Color Theme">
        🎨
      </button>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [themeKey, setThemeKey] = useState(() => {
    try {
      const saved = localStorage.getItem('ks_theme');
      return saved && THEMES[saved] ? saved : 'darkBlue';
    } catch { return 'darkBlue'; }
  });
  const [demoOpen, setDemoOpen] = useState(false);

  const theme = THEMES[themeKey];

  const handleThemeChange = (key) => {
    setThemeKey(key);
    try { localStorage.setItem('ks_theme', key); } catch {}
  };

  useEffect(() => {
    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;
  }, [theme.bg, theme.text]);

  // Parallax scroll
  useEffect(() => {
    const handler = () => {
      const sy = window.scrollY;
      document.querySelectorAll('[data-parallax]').forEach(el => {
        const speed = parseFloat(el.dataset.parallax) || 0.3;
        el.style.transform = `translateY(${sy * speed}px)`;
      });
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <div style={{ background: theme.bg, minHeight: '100vh' }}>
      <Navbar theme={theme} onDemoClick={() => setDemoOpen(true)} />
      <Hero theme={theme} onDemoClick={() => setDemoOpen(true)} />
      <TrustBar theme={theme} />
      <Services theme={theme} />
      <HowItWorks theme={theme} />
      <WhyUs theme={theme} />
      <Industries theme={theme} />
      <CaseStudy theme={theme} />
      <CTA theme={theme} onDemoClick={() => setDemoOpen(true)} />
      <Footer theme={theme} />
      {demoOpen && <DemoModal theme={theme} onClose={() => setDemoOpen(false)} />}
      <ThemeSwitcher current={themeKey} onChange={handleThemeChange} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
